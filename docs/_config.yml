# Configuração do site oficial Ascension no GitHub Pages.
# Publicação esperada: branch main, diretório /docs.
title: Ascension
description: >-
  Ascension é uma evolução independente e aberta do GoldenEye 007 para PC,
  com preservação do clássico, localização PT-BR, experiência moderna,
  documentação acessível e engenharia rastreável.
url: https://mukasanches.github.io
baseurl: /goldeneye-pc-port
lang: pt-BR
show_downloads: false

# O index principal é HTML próprio e não depende de um tema Jekyll.
# Os documentos Markdown continuam disponíveis como documentação técnica.
plugins:
  - jekyll-sitemap

exclude:
  - BACKLOG.md
  - HANDOFF.md
  - dev/findings-index.csv
