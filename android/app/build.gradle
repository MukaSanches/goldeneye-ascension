plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.muka.ascension'
    compileSdk 35

    defaultConfig {
        applicationId 'com.muka.ascension'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // CI checks out the same pinned SDL2 revision used by the native build.
            java.srcDir '../../third_party/SDL/android-project/app/src/main/java'
            jniLibs.srcDir 'src/main/jniLibs'
        }
    }

    packaging {
        jniLibs {
            // AGP 8.5.1+ aligns uncompressed JNI libraries for 16 KiB devices.
            useLegacyPackaging = false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        // Runtime conversion uses only the Python standard library. Keep source
        // as source so CI does not require a matching host Python 3.13 install.
        pyc {
            src = false
        }
    }
}

// The existing converters need only the ROM plus this small slice of repository
// metadata. Generate a deterministic asset at build time instead of shipping
// pre-generated game sidecars or the whole decomp tree in the APK.
def converterAssetDir = layout.buildDirectory.dir('generated/ascensionConverterAssets')
def converterTask = tasks.register('prepareAscensionConverterAsset', Zip) {
    archiveFileName = 'ascension_converter.zip'
    destinationDirectory = converterAssetDir
    reproducibleFileOrder = true
    preserveFileTimestamps = false

    from(rootProject.file('../tools_pc')) {
        include 'd43_emit.py', 'd69_emit.py', 'd88_emit.py', 'd88_propdefs.py', 'd125_check.py'
        into 'tools_pc'
    }
    from(rootProject.file('../scripts/filelist.u.csv')) {
        into 'scripts'
    }
    from(rootProject.file('../assets/obseg/file_resource_table.inc.c')) {
        into 'assets/obseg'
    }
    from(rootProject.file('../assets')) {
        // Ant-style include is deliberate: Gradle's closure include did not
        // descend through this generated asset tree on CI and silently produced
        // a ZIP with zero model headers.
        include '**/modelFileHeader.inc.c'
        into 'assets'
    }
}

// Fail closed: every model metadata header present in the repository must be in
// the converter ZIP. This makes a partial runtime converter asset impossible to
// publish as a green APK.
def verifyConverterTask = tasks.register('verifyAscensionConverterAsset') {
    dependsOn converterTask
    doLast {
        File archive = converterTask.get().archiveFile.get().asFile
        if (!archive.isFile() || archive.length() == 0L) {
            throw new GradleException("Ascension converter asset was not generated")
        }

        Set<File> sourceHeaders = fileTree(rootProject.file('../assets')) {
            include '**/modelFileHeader.inc.c'
        }.files
        if (sourceHeaders.isEmpty()) {
            throw new GradleException("No source modelFileHeader.inc.c files were found")
        }

        def archiveTree = zipTree(archive)
        Set<File> zippedHeaders = archiveTree.matching {
            include 'assets/**/modelFileHeader.inc.c'
        }.files
        if (zippedHeaders.size() != sourceHeaders.size()) {
            throw new GradleException(
                "Incomplete converter metadata: source=${sourceHeaders.size()}, zip=${zippedHeaders.size()}")
        }

        [
            'tools_pc/d43_emit.py',
            'tools_pc/d69_emit.py',
            'tools_pc/d88_emit.py',
            'tools_pc/d88_propdefs.py',
            'tools_pc/d125_check.py',
            'scripts/filelist.u.csv',
            'assets/obseg/file_resource_table.inc.c'
        ].each { requiredPath ->
            if (archiveTree.matching { include requiredPath }.files.size() != 1) {
                throw new GradleException("Missing converter asset entry: ${requiredPath}")
            }
        }

        println "Ascension converter asset verified: ${zippedHeaders.size()} model headers"
    }
}

android.sourceSets.main.assets.srcDir(converterAssetDir)
tasks.named('preBuild').configure {
    dependsOn verifyConverterTask
}
