plugins {
    id 'com.android.application'
}

android {
    namespace 'com.muka.ascension'
    compileSdk 35

    defaultConfig {
        applicationId 'com.muka.ascension'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // CI checks out the same pinned SDL2 revision used by the native build.
            java.srcDir '../../third_party/SDL/android-project/app/src/main/java'
            jniLibs.srcDir 'src/main/jniLibs'
        }
    }

    packaging {
        jniLibs {
            // AGP 8.5.1+ aligns uncompressed JNI libraries for 16 KiB devices.
            useLegacyPackaging = false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}
