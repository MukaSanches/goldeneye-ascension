name: Modern Controls V3 validation

on:
  push:
    branches: [ ascension-modern-controls-v3 ]
  pull_request:
    branches: [ ascension-modern-controls-v2, ascension-modern-controls-v3 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-controls-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gcc-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-14 g++-14 cmake python3 \
            libsdl2-dev zlib1g-dev libgl1-mesa-dev

      - name: Python syntax
        run: python3 -m compileall -q tools_pc

      - name: Apply V2 baseline
        run: |
          python3 tools_pc/apply_modern_controls_v2.py --check
          python3 tools_pc/apply_modern_controls_v2.py --no-backup

      - name: V3 fail-closed preflight and apply
        run: |
          python3 tools_pc/apply_modern_controls_v3.py --check
          python3 tools_pc/apply_modern_controls_v3.py --no-backup

      - name: V3 randomized and regression tests
        run: |
          python3 tools_pc/test_modern_controls_v2.py
          python3 tools_pc/test_modern_controls_v3.py
          python3 tools_pc/verify_ascension_contracts.py
          git diff --check

      - name: Regenerate ROM symbols
        run: python3 scripts/gen_romassets.py u

      - name: Configure GCC
        run: cmake -S . -B build-v3-gcc -DROMID=ntsc-final -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14

      - name: Build GCC
        run: cmake --build build-v3-gcc -j"$(nproc)"

      - name: Verify GCC binary
        run: |
          test -f build-v3-gcc/ge007.x86_64
          file build-v3-gcc/ge007.x86_64

  linux-clang-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake python3 libsdl2-dev zlib1g-dev libgl1-mesa-dev

      - name: Apply and test V3
        run: |
          python3 tools_pc/apply_modern_controls_v2.py --no-backup
          python3 tools_pc/apply_modern_controls_v3.py --no-backup
          python3 tools_pc/test_modern_controls_v3.py
          git diff --check

      - name: Regenerate ROM symbols
        run: python3 scripts/gen_romassets.py u

      - name: Configure Clang
        run: cmake -S . -B build-v3-clang -DROMID=ntsc-final -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18

      - name: Build Clang
        run: cmake --build build-v3-clang -j"$(nproc)"

      - name: Verify Clang binary
        run: |
          test -f build-v3-clang/ge007.x86_64
          file build-v3-clang/ge007.x86_64

  windows-v3:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python

      - name: Python syntax
        run: python -m compileall -q tools_pc

      - name: Apply V2 + V3 and run randomized contracts
        run: |
          python tools_pc/apply_modern_controls_v2.py --check
          python tools_pc/apply_modern_controls_v2.py --no-backup
          python tools_pc/apply_modern_controls_v3.py --check
          python tools_pc/apply_modern_controls_v3.py --no-backup
          python tools_pc/test_modern_controls_v2.py
          python tools_pc/test_modern_controls_v3.py

      - name: Regenerate ROM symbols
        run: python scripts/gen_romassets.py u

      - name: Build Windows
        run: ./build-pc.sh ntsc-final

      - name: Verify executable
        run: test -f build-pc/ge007.x86_64.exe
