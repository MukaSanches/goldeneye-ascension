name: Android native V1

on:
  push:
    branches: [ android-v1 ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-arm64:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: 30.0.16248370
      CMAKE_VERSION: 3.22.1
      SDL_COMMIT: b90ac95029d801c5abc59472ba8e2200dff31e1e
      BUILD_TOOLS_VERSION: 35.0.0
    steps:
      - name: Checkout Ascension Android branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            2>&1 | tee android-toolchain.log

      - name: Fetch pinned SDL2
        shell: bash
        run: |
          set -o pipefail
          git clone https://github.com/libsdl-org/SDL.git third_party/SDL 2>&1 | tee sdl-fetch.log
          git -C third_party/SDL checkout "$SDL_COMMIT" 2>&1 | tee -a sdl-fetch.log
          test "$(git -C third_party/SDL rev-parse HEAD)" = "$SDL_COMMIT"

      - name: Configure ARM64 native core
        shell: bash
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmake/${CMAKE_VERSION}/bin/cmake" \
            -S android \
            -B build-android-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DASCENSION_SDL2_SOURCE_DIR="$GITHUB_WORKSPACE/third_party/SDL" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            2>&1 | tee native-configure.log

      - name: Compile ARM64 native core
        id: native_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmake/${CMAKE_VERSION}/bin/cmake" --build build-android-arm64 --target ascension -j2 2>&1 | tee native-build.log

      - name: Extract first compiler failure
        if: always()
        shell: bash
        run: |
          {
            echo '=== first error/fatal error ==='
            grep -n -m1 -E '(^|[[:space:]])(fatal )?error:' native-build.log || true
            echo '=== final 120 lines ==='
            tail -n 120 native-build.log || true
          } | tee native-first-failure.txt

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascension-android-arm64-diagnostics
          path: |
            android-toolchain.log
            sdl-fetch.log
            native-configure.log
            native-build.log
            native-first-failure.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if native compilation failed
        if: steps.native_build.outcome != 'success'
        run: exit 1

      - name: Stage APK native libraries
        shell: bash
        run: |
          set -euo pipefail
          JNI_DIR="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_DIR"

          ASCENSION_SO="build-android-arm64/libascension.so"
          SDL_SO="build-android-arm64/sdl2/libSDL2.so"
          CXX_SO="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          test -f "$ASCENSION_SO"
          test -f "$SDL_SO"
          test -f "$CXX_SO"

          cp "$ASCENSION_SO" "$JNI_DIR/libascension.so"
          cp "$SDL_SO" "$JNI_DIR/libSDL2.so"
          cp "$CXX_SO" "$JNI_DIR/libc++_shared.so"

          for so in "$JNI_DIR"/*.so; do
            echo "== $so =="
            file "$so"
            readelf -h "$so" | grep -E 'Class:|Machine:'
            readelf -lW "$so" | awk '/ LOAD / { print }'
            if readelf -lW "$so" | awk '/ LOAD / { if ($NF != "0x4000" && $NF != "0x10000") bad=1 } END { exit bad }'; then
              :
            else
              echo "ELF segment alignment is not 16 KiB compatible: $so" >&2
              exit 1
            fi
          done | tee native-package-verification.log

      - name: Build debug APK
        id: apk_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p android :app:assembleDebug --stacktrace 2>&1 | tee apk-build.log

      - name: Extract APK build failure
        if: always()
        shell: bash
        run: |
          {
            echo '=== first Gradle failure ==='
            grep -n -m1 -E '(^|[[:space:]])(FAILURE:|error:|Execution failed for task)' apk-build.log || true
            echo '=== final 160 lines ==='
            tail -n 160 apk-build.log || true
          } | tee apk-first-failure.txt

      - name: Upload APK diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascension-android-apk-diagnostics
          path: |
            apk-build.log
            apk-first-failure.txt
            native-package-verification.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if APK build failed
        if: steps.apk_build.outcome != 'success'
        run: exit 1

      - name: Verify APK contents and 16 KiB packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt" dump badging "$APK" | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/zipalign" -c -P 16 -v 4 "$APK" | tee apk-zipalign.txt

          for name in libascension.so libSDL2.so libc++_shared.so; do
            unzip -l "$APK" "lib/arm64-v8a/$name" | grep -q "lib/arm64-v8a/$name"
          done

          APK_NATIVE_DIR="$(mktemp -d)"
          so_count=0
          while IFS= read -r so_path; do
            so_count=$((so_count + 1))
            so_file="$APK_NATIVE_DIR/$so_count.so"
            unzip -p "$APK" "$so_path" > "$so_file"
            file "$so_file" | grep -q 'ARM aarch64'
            readelf -h "$so_file" | grep -q 'Machine:.*AArch64'

            load_count=0
            while IFS= read -r align; do
              load_count=$((load_count + 1))
              align_value=$((align))
              if (( align_value < 0x4000 || align_value % 0x4000 != 0 )); then
                echo "APK ELF LOAD alignment is not 16 KiB compatible: $so_path ($align)" >&2
                exit 1
              fi
            done < <(readelf -lW "$so_file" | awk '/ LOAD / { print $NF }')
            if (( load_count == 0 )); then
              echo "No ELF LOAD segments found: $so_path" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^lib/arm64-v8a/.*[.]so$')
          test "$so_count" -ge 3
          rm -rf "$APK_NATIVE_DIR"

          ASCENSION_SO="android/app/src/main/jniLibs/arm64-v8a/libascension.so"
          nm -D "$ASCENSION_SO" | grep -Eq '[[:space:]]T[[:space:]]SDL_main$'
          JNI_SYMBOLS="$(readelf -Ws "$ASCENSION_SO" | awk '/Java_com_muka_ascension_NativeInput_/ { print $8 }' | sort -u)"
          test "$(printf '%s\n' "$JNI_SYMBOLS" | sed '/^$/d' | wc -l)" -eq 6
          for method in setMove setLook addGyro setButton setTouchActive reset; do
            printf '%s\n' "$JNI_SYMBOLS" | grep -qx "Java_com_muka_ascension_NativeInput_$method"
          done
          if readelf -Ws "$ASCENSION_SO" | grep -q 'Java_com_mukasanches_ascension_NativeInput_'; then
            echo "Stale NativeInput JNI package prefix found" >&2
            exit 1
          fi

          : > apk-dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings >> apk-dex-strings.txt
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$')
          for cls in GameActivity MobileControlsView NativeInput; do
            grep -q "Lcom/muka/ascension/$cls;" apk-dex-strings.txt
          done

          CONVERTER_ZIP="$(mktemp)"
          unzip -p "$APK" assets/ascension_converter.zip > "$CONVERTER_ZIP"
          test "$(unzip -Z1 "$CONVERTER_ZIP" | grep -ci 'modelfileheader[.]inc[.]c$')" -eq 80
          rm -f "$CONVERTER_ZIP"

          if unzip -l "$APK" | grep -qE '(^|[[:space:]])[^[:space:]]*\.(z64|n64|v64)([[:space:]]|$)'; then
            echo "Forbidden ROM payload found inside APK" >&2
            exit 1
          fi

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goldeneye-ascension-android-v1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: ascension-android-arm64-native
          path: |
            android/app/src/main/jniLibs/arm64-v8a/libascension.so
            android/app/src/main/jniLibs/arm64-v8a/libSDL2.so
            android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          if-no-files-found: error
          retention-days: 14


  runtime-smoke:
    name: Android 15 runtime smoke (no ROM)
    needs: native-arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Download installable APK
        uses: actions/download-artifact@v4
        with:
          name: goldeneye-ascension-android-v1-debug-apk
          path: runtime-apk

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Boot Android 15 and run native self-test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-load
            -no-snapshot-save
          script: |
            set -eu

            APK="$(find runtime-apk -type f -name '*.apk' -print -quit)"
            test -n "$APK"
            test -f "$APK"

            adb wait-for-device
            adb shell getprop ro.build.version.sdk > smoke-sdk.txt
            cat smoke-sdk.txt
            adb shell getprop ro.product.cpu.abilist > smoke-abis.txt
            cat smoke-abis.txt
            adb shell getconf PAGE_SIZE > smoke-page-size.txt 2>&1 || true
            cat smoke-page-size.txt

            if ! adb install -r "$APK" > smoke-install.txt 2>&1; then
              cat smoke-install.txt
              exit 1
            fi
            cat smoke-install.txt

            adb logcat -c
            adb shell am force-stop com.muka.ascension || true

            if ! adb shell am start -W \
              -n com.muka.ascension/.LauncherActivity \
              --ez ascension.selftest true \
              > smoke-activity.txt 2>&1; then
              cat smoke-activity.txt
              adb logcat -d -v threadtime > smoke-logcat.txt || true
              exit 1
            fi
            cat smoke-activity.txt

            ok=0
            for i in $(seq 1 45); do
              adb logcat -d -v threadtime > smoke-logcat.txt

              if grep -q 'ASCENSION_ANDROID_SELFTEST_OK' smoke-logcat.txt; then
                ok=1
                break
              fi

              if grep -Eq \
                'ASCENSION_ANDROID_SELFTEST_FAILED|android selftest:|Fatal signal|FATAL EXCEPTION|UnsatisfiedLinkError' \
                smoke-logcat.txt; then
                break
              fi

              sleep 1
            done

            echo '=== Ascension runtime markers ==='
            grep -E 'ASCENSION_ANDROID_SELFTEST|android selftest:|Ascension|FATAL EXCEPTION|Fatal signal|UnsatisfiedLinkError' \
              smoke-logcat.txt | tail -n 240 || true

            if [ "$ok" -ne 1 ]; then
              echo 'Android runtime self-test did not reach ASCENSION_ANDROID_SELFTEST_OK' >&2
              adb shell dumpsys activity top > smoke-activity-top.txt || true
              exit 1
            fi

      - name: Upload Android runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascension-android-runtime-smoke
          path: |
            smoke-sdk.txt
            smoke-abis.txt
            smoke-page-size.txt
            smoke-install.txt
            smoke-activity.txt
            smoke-activity-top.txt
            smoke-logcat.txt
          if-no-files-found: warn
          retention-days: 14
