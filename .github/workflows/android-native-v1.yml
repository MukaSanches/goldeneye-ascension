name: Android native V1

on:
  push:
    branches: [ android-v1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-arm64:
    name: Build libascension.so (ARM64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Ascension Android branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;30.0.16248370" "cmake;3.22.1" 2>&1 | tee android-toolchain.log

      - name: Fetch pinned SDL2
        shell: bash
        run: |
          set -o pipefail
          git clone https://github.com/libsdl-org/SDL.git third_party/SDL 2>&1 | tee sdl-fetch.log
          git -C third_party/SDL checkout b90ac95029d801c5abc59472ba8e2200dff31e1e 2>&1 | tee -a sdl-fetch.log

      - name: Configure ARM64 native core
        shell: bash
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" \
            -S android \
            -B build-android-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/30.0.16248370/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DASCENSION_SDL2_SOURCE_DIR="$GITHUB_WORKSPACE/third_party/SDL" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            2>&1 | tee native-configure.log

      - name: Compile ARM64 native core
        id: native_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build build-android-arm64 --target ascension -j2 2>&1 | tee native-build.log

      - name: Extract first compiler failure
        if: always()
        shell: bash
        run: |
          {
            echo '=== first error/fatal error ==='
            grep -n -m1 -E '(^|[[:space:]])(fatal )?error:' native-build.log || true
            echo '=== final 120 lines ==='
            tail -n 120 native-build.log || true
          } | tee native-first-failure.txt

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascension-android-arm64-diagnostics
          path: |
            android-toolchain.log
            sdl-fetch.log
            native-configure.log
            native-build.log
            native-first-failure.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if native compilation failed
        if: steps.native_build.outcome != 'success'
        run: exit 1

      - name: Verify native output
        shell: bash
        run: |
          test -f build-android-arm64/libascension.so
          file build-android-arm64/libascension.so
          readelf -h build-android-arm64/libascension.so | grep -E 'Class:|Machine:'
          readelf -lW build-android-arm64/libascension.so | grep -E 'LOAD|Align' | head -20

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ascension-android-arm64-native
          path: build-android-arm64/libascension.so
          if-no-files-found: error
          retention-days: 14
