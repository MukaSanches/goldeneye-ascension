name: CI

on:
  push:
    branches: [ main, master, ascension-modern-controls-v1, ascension-dev ]
    tags: [ 'v*' ]
    # No paths-ignore here: tag pushes must always build so a release can be
    # cut even when the tagged commit only touched docs, and a workflow that
    # never triggers would leave a required status check pending forever.
    # Docs-only branch pushes are instead skipped by the `changes` job below,
    # which reports the build jobs as "skipped" (green for branch protection).
  pull_request:
    # No paths-ignore here either: a docs-only PR must still trigger the
    # workflow so the required checks report a status. The `changes` job
    # below diffs the PR against its base and, for a docs-only PR, reports
    # the build jobs as "skipped" — which branch protection accepts as
    # success. With paths-ignore the workflow never ran and the required
    # checks stayed "expected" forever, wedging every docs PR (M-44).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The repository's Ascension release branches are intentionally patcher-first:
# the committed C tree stays close to upstream and tools_pc/ascension.py applies
# the release stack deterministically. For PRs whose base is the 0.0.4 release
# branch, the ordinary CI therefore prepares that stack before configure/build.
# This condition is deliberately narrow: main/master/upstream CI behavior is
# unchanged.

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          elif [ "${{ github.event_name }}" != "push" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "no usable base ${base}/head ${head} — building to be safe"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$|^NOTICE$)'; then
            echo "code=true"  >> "$GITHUB_OUTPUT"
          else
            echo "docs-only push — skipping build"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3 libsdl2-dev zlib1g-dev libgl1-mesa-dev

      - name: Byte-compile Python tooling
        run: python3 -m compileall -q scripts tools_pc

      - name: Validate Ascension patcher manifest
        run: python3 tools_pc/apply_ascension_safe_gameplay_pack.py --preflight-only

      - name: Validate Ascension test runner shell syntax
        run: bash -n tools_pc/run_ascension_safe_test.sh

      - name: Check generated dev indexes are current
        run: |
          python3 tools_pc/gen_findings_index.py --check
          python3 tools_pc/gen_env_probes.py --check

      - name: Prepare Ascension 0.0.4 release stack
        if: github.event_name == 'pull_request' && github.base_ref == 'release/ascension-0.0.4'
        run: python3 tools_pc/ascension.py prepare

      - name: Regenerate ROM-asset symbol file (US)
        run: |
          python3 scripts/gen_romassets.py u
          git diff --stat -- port/src/romassets_u.s

      - name: CMake configure (ntsc-final)
        run: cmake -S . -B build-ntsc -DROMID=ntsc-final

  linux-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-14 g++-14 cmake python3 \
            libsdl2-dev zlib1g-dev libgl1-mesa-dev ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ hashFiles('CMakeLists.txt') }}-
            ccache-linux-

      - name: Prepare Ascension 0.0.4 release stack
        if: github.event_name == 'pull_request' && github.base_ref == 'release/ascension-0.0.4'
        run: python3 tools_pc/ascension.py prepare

      - name: Regenerate ROM-asset symbol file (US)
        run: python3 scripts/gen_romassets.py u

      - name: Configure (ntsc-final)
        run: cmake -S . -B build-linux -DROMID=ntsc-final
             -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14

      - name: Build (ntsc-final)
        run: cmake --build build-linux -j"$(nproc)"

      - name: ccache stats
        run: ccache -s

      - name: Show binary
        run: |
          ls -la build-linux/ge007* || true
          file build-linux/ge007* || true

      - name: Package Linux bundle
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="0.0.0-ci.${GITHUB_SHA::7}"
          fi
          tools_pc/bundle-linux.sh "$V"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: goldeneye-pc-port-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  windows-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python
            mingw-w64-x86_64-ccache
            zip
            unzip

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-${{ hashFiles('CMakeLists.txt') }}-
            ccache-windows-

      - name: Prepare Ascension 0.0.4 release stack
        if: github.event_name == 'pull_request' && github.base_ref == 'release/ascension-0.0.4'
        run: python tools_pc/ascension.py prepare

      - name: Regenerate ROM-asset symbol file (US)
        run: python scripts/gen_romassets.py u

      - name: Build (ntsc-final)
        run: ./build-pc.sh ntsc-final

      - name: ccache stats
        run: ccache -s

      - name: Package Windows bundle
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="0.0.0-ci.${GITHUB_SHA::7}"
          fi
          tools_pc/bundle-win.sh "$V"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: goldeneye-pc-port-win64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: [ changes, validate, windows-build, linux-build ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: goldeneye-pc-port-win64
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: goldeneye-pc-port-linux-x86_64
          path: dist

      - name: Create or update draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=(dist/*.zip dist/*.zip.sha256 dist/*.tar.gz dist/*.tar.gz.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --draft --prerelease \
              --title "GoldenEye 007 PC Port $TAG" \
              --notes-file .github/release-notes.md
          fi
