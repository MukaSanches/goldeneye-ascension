name: Ascension Final Q Watch validation

on:
  push:
    branches: [ ascension-watch-final-v1 ]
  pull_request:
    branches: [ ascension-ui-overhaul-v2, ascension-watch-final-v1 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gcc14:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 1 }

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake python3 libsdl2-dev zlib1g-dev libgl1-mesa-dev

      - name: Python syntax
        run: python3 -m compileall -q tools_pc

      - name: Rebuild validated Ascension stack
        run: |
          python3 tools_pc/apply_modern_controls_v2.py --check
          python3 tools_pc/apply_modern_controls_v2.py --no-backup
          python3 tools_pc/apply_modern_controls_v3.py --check
          python3 tools_pc/apply_modern_controls_v3.py --no-backup
          python3 tools_pc/apply_modern_menu_guard.py --check
          python3 tools_pc/apply_modern_menu_guard.py
          python3 tools_pc/apply_ui_overhaul_v1.py --check
          python3 tools_pc/apply_ui_overhaul_v1.py
          python3 tools_pc/fix_ui_overhaul_text_state.py --check
          python3 tools_pc/fix_ui_overhaul_text_state.py
          python3 tools_pc/install_ui_overhaul_v2.py --check
          python3 tools_pc/install_ui_overhaul_v2.py --no-backup
          python3 tools_pc/install_ui_overhaul_v2.py --check
          python3 tools_pc/apply_persistent_f10_hint.py --check
          python3 tools_pc/apply_persistent_f10_hint.py --no-backup
          python3 tools_pc/apply_persistent_f10_hint.py --check
          python3 tools_pc/apply_unlock_all_missions.py --check
          python3 tools_pc/apply_unlock_all_missions.py --no-backup
          python3 tools_pc/apply_unlock_all_missions.py --check
          python3 tools_pc/apply_watch_ui_final.py --check
          python3 tools_pc/apply_watch_ui_final.py --no-backup
          python3 tools_pc/apply_watch_ui_final.py --check

      - name: Regression and watch contracts
        run: |
          python3 tools_pc/test_modern_controls_v2.py
          python3 tools_pc/test_modern_controls_v3.py
          python3 tools_pc/test_ui_overhaul_v1.py
          python3 tools_pc/test_ui_overhaul_v2.py
          python3 tools_pc/test_persistent_f10_hint.py
          python3 tools_pc/test_unlock_all_missions.py
          python3 tools_pc/test_watch_ui_final.py
          python3 tools_pc/verify_ascension_contracts.py
          git diff --check

      - name: ROM symbols
        run: python3 scripts/gen_romassets.py u

      - name: Configure GCC 14
        run: cmake -S . -B build-watch-final-gcc14 -DROMID=ntsc-final -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14

      - name: Build GCC 14
        run: cmake --build build-watch-final-gcc14 -j"$(nproc)"

      - name: Verify Linux binary
        run: |
          test -f build-watch-final-gcc14/ge007.x86_64
          file build-watch-final-gcc14/ge007.x86_64

  linux-gcc13:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 1 }

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake python3 libsdl2-dev zlib1g-dev libgl1-mesa-dev

      - name: Apply full stack and test
        run: |
          python3 tools_pc/apply_modern_controls_v2.py --check
          python3 tools_pc/apply_modern_controls_v2.py --no-backup
          python3 tools_pc/apply_modern_controls_v3.py --check
          python3 tools_pc/apply_modern_controls_v3.py --no-backup
          python3 tools_pc/apply_modern_menu_guard.py --check
          python3 tools_pc/apply_modern_menu_guard.py
          python3 tools_pc/apply_ui_overhaul_v1.py --check
          python3 tools_pc/apply_ui_overhaul_v1.py
          python3 tools_pc/fix_ui_overhaul_text_state.py --check
          python3 tools_pc/fix_ui_overhaul_text_state.py
          python3 tools_pc/install_ui_overhaul_v2.py --check
          python3 tools_pc/install_ui_overhaul_v2.py --no-backup
          python3 tools_pc/install_ui_overhaul_v2.py --check
          python3 tools_pc/apply_persistent_f10_hint.py --check
          python3 tools_pc/apply_persistent_f10_hint.py --no-backup
          python3 tools_pc/apply_persistent_f10_hint.py --check
          python3 tools_pc/apply_unlock_all_missions.py --check
          python3 tools_pc/apply_unlock_all_missions.py --no-backup
          python3 tools_pc/apply_unlock_all_missions.py --check
          python3 tools_pc/apply_watch_ui_final.py --check
          python3 tools_pc/apply_watch_ui_final.py --no-backup
          python3 tools_pc/apply_watch_ui_final.py --check
          python3 tools_pc/test_modern_controls_v2.py
          python3 tools_pc/test_modern_controls_v3.py
          python3 tools_pc/test_ui_overhaul_v2.py
          python3 tools_pc/test_persistent_f10_hint.py
          python3 tools_pc/test_unlock_all_missions.py
          python3 tools_pc/test_watch_ui_final.py
          git diff --check

      - name: ROM symbols
        run: python3 scripts/gen_romassets.py u

      - name: Configure and build GCC 13
        run: |
          cmake -S . -B build-watch-final-gcc13 -DROMID=ntsc-final -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build-watch-final-gcc13 -j"$(nproc)"
          test -f build-watch-final-gcc13/ge007.x86_64

  windows:
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 1 }

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python

      - name: Python syntax
        run: python -m compileall -q tools_pc

      - name: Apply full stack atomically
        run: |
          python tools_pc/apply_modern_controls_v2.py --check
          python tools_pc/apply_modern_controls_v2.py --no-backup
          python tools_pc/apply_modern_controls_v3.py --check
          python tools_pc/apply_modern_controls_v3.py --no-backup
          python tools_pc/apply_modern_menu_guard.py --check
          python tools_pc/apply_modern_menu_guard.py
          python tools_pc/apply_ui_overhaul_v1.py --check
          python tools_pc/apply_ui_overhaul_v1.py
          python tools_pc/fix_ui_overhaul_text_state.py --check
          python tools_pc/fix_ui_overhaul_text_state.py
          python tools_pc/install_ui_overhaul_v2.py --check
          python tools_pc/install_ui_overhaul_v2.py --no-backup
          python tools_pc/install_ui_overhaul_v2.py --check
          python tools_pc/apply_persistent_f10_hint.py --check
          python tools_pc/apply_persistent_f10_hint.py --no-backup
          python tools_pc/apply_persistent_f10_hint.py --check
          python tools_pc/apply_unlock_all_missions.py --check
          python tools_pc/apply_unlock_all_missions.py --no-backup
          python tools_pc/apply_unlock_all_missions.py --check
          python tools_pc/apply_watch_ui_final.py --check
          python tools_pc/apply_watch_ui_final.py --no-backup
          python tools_pc/apply_watch_ui_final.py --check

      - name: Regression and watch contracts
        run: |
          python tools_pc/test_modern_controls_v2.py
          python tools_pc/test_modern_controls_v3.py
          python tools_pc/test_ui_overhaul_v2.py
          python tools_pc/test_persistent_f10_hint.py
          python tools_pc/test_unlock_all_missions.py
          python tools_pc/test_watch_ui_final.py
          "/c/Program Files/Git/bin/git.exe" diff --check

      - name: ROM symbols and Windows build
        run: |
          python scripts/gen_romassets.py u
          ./build-pc.sh ntsc-final
          test -f build-pc/ge007.x86_64.exe
