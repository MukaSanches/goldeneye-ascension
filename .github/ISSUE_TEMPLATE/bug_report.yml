name: Bug report
description: Build failure, crash, hang, regression, or rendering/audio/input defect in Ascension
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pelo relatório. Antes de abrir:

        - atualize `main` e tente reproduzir novamente;
        - consulte `docs/building.md`, `docs/PROJECT_STATUS.md` e issues abertas;
        - não anexe ROM, assets extraídos ou outros dados comerciais do jogo.

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Saída de `git rev-parse --short HEAD`.
      placeholder: c8b7b63
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Região / ROMID
      options:
        - ntsc-final
        - pal-final
        - jpn-final
        - Outro / não se aplica
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Sistema e ambiente
      description: Exemplo: Windows 11 24H2, MSYS2 MINGW64.
      placeholder: Windows 11, MSYS2 MINGW64
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Área afetada
      options:
        - Preparação de dados / assets
        - CMake / configuração
        - Compilação / link
        - Inicialização
        - Crash / hang em runtime
        - Renderização / HUD / vídeo
        - Áudio
        - Teclado / mouse / controle
        - Localização / texto
        - Performance
        - Outro
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: É uma regressão?
      description: Funcionava em um commit anterior conhecido?
      options:
        - Sim
        - Não
        - Não sei
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Comportamento observado
      description: Descreva exatamente o que aconteceu.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      description: O que deveria ter acontecido?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Passos para reproduzir
      description: Inclua comandos, flags, nível, menu e ações em ordem.
      placeholder: |
        1. ./build-pc.sh ntsc-final
        2. Abra o executável
        3. Carregue ...
        4. Faça ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Cole terminal, `ge007.crash.log` ou stack trace. Remova qualquer dado proprietário antes de enviar.
      render: text

  - type: textarea
    id: evidence
    attributes:
      label: Evidência adicional
      description: Screenshot, vídeo curto, comparação de commits ou observações de performance. Não anexe ROM/assets comerciais.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Procurei por issues abertas ou duplicadas.
          required: true
        - label: Não estou anexando ROM nem assets comerciais extraídos.
          required: true
